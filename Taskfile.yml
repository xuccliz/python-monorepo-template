version: "3"

tasks:
  # ========================================
  # Default & Setup
  # ========================================
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: Initial project docker setup (clean + install)
    cmds:
      - task: clean
      - task: build

  # ========================================
  # Docker Services
  # ========================================
  build:
    desc: Build Docker images
    cmds:
      - docker compose build

  up:
    desc: Start all services with Docker Compose
    cmds:
      - docker compose up --build -d

  up:debug:
    desc: Start all services with DEBUG log level
    cmds:
      - LOG_LEVEL=DEBUG docker compose up --build -d

  down:
    desc: Stop and remove containers
    cmds:
      - docker compose down --remove-orphans

  stop:
    desc: Stop containers (keeps containers + volumes)
    cmds:
      - docker compose stop

  restart:
    desc: Restart containers
    cmds:
      - docker compose restart

  ps:
    desc: Show service status
    cmds:
      - docker compose ps

  # ========================================
  # Logs
  # ========================================
  logs:
    desc: Follow logs for all services
    cmds:
      - docker compose logs -f --tail=2000

  # ========================================
  # Testing
  # ========================================
  evaluate:
    desc: "Evaluate models on historical data (use: task evaluate -- --symbols NVDA --dates 2025-12-01)"
    cmds:
      - PYTHONPATH=packages/lab uv run python -m evaluation.main {{.CLI_ARGS}}

  fetch:historical:
    desc: "Fetch historical data into local cache (use: task fetch:historical -- --years 15)"
    cmds:
      - PYTHONPATH=packages/lab uv run python -m evaluation.fetch_historical {{.CLI_ARGS}}

  test:local:
    desc: Run all tests locally (no Docker)
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  test:local:unsafe:
    desc: Run tests locally with real credentials (dangerous!)
    cmds:
      - RUN_UNSAFE_TESTS=1 uv run pytest {{.CLI_ARGS}}

  test:
    desc: Run all tests in Docker
    cmds:
      - docker compose run --rm trader uv run pytest {{.CLI_ARGS}}

  test:unsafe:
    desc: Run tests in Docker with real credentials (dangerous!)
    cmds:
      - docker compose run --rm -e RUN_UNSAFE_TESTS=1 trader uv run pytest {{.CLI_ARGS}}

  latency:
    desc: Measure end-to-end trade cycle latency
    cmds:
      - uv run python packages/trader/scripts/measure_latency.py

  latency:profile:
    desc: Profile end-to-end trade cycle latency
    cmds:
      - uv run python packages/trader/scripts/measure_latency.py --profile

  wss:
    desc: Dump raw WebSocket messages from options feed
    cmds:
      - uv run python packages/listener/scripts/dump_wss.py

  wss:store:
    desc: "Collect WSS data and dump OptionStore (use: task wss:store -- 60)"
    cmds:
      - uv run python packages/listener/scripts/dump_store.py {{.CLI_ARGS}}

  simulate:
    desc: "Run probability models simulation (use: task simulate -- --ticker NVDA --days 30)"
    cmds:
      - uv run python -m modeler.scripts.run_models {{.CLI_ARGS}}

  simulate:all:
    desc: "Run probability models for all symbols and all dates"
    cmds:
      - uv run python -m modeler.scripts.run_models --all-symbols {{.CLI_ARGS}}

  # ========================================
  # Formatting
  # ========================================
  format:
    desc: Format and lint all code (Python + TypeScript + file checks)
    cmds:
      # Basic file checks
      - cmd: uv run pre-commit run trailing-whitespace --all-files
        ignore_error: true
      - cmd: uv run pre-commit run end-of-file-fixer --all-files
        ignore_error: true
      - cmd: uv run pre-commit run check-yaml --all-files
        ignore_error: true
      - cmd: uv run pre-commit run check-json --all-files
        ignore_error: true
      - cmd: uv run pre-commit run check-added-large-files --all-files
        ignore_error: true
      # Python formatting and linting
      - cmd: uv run ruff format packages/
        ignore_error: true
      - cmd: uv run ruff check packages/ --fix
        ignore_error: true
      - cmd: uv run pyright packages/
        ignore_error: true
      # Unused code detection
      - cmd: uv run vulture packages/
        ignore_error: true

  # ========================================
  # Cleanup
  # ========================================
  clean:
    desc: Complete Docker cleanup (containers + volumes + images + networks)
    cmds:
      - echo "⚠️  WARNING - This will remove ALL containers, volumes, images, and networks for this project"
      - docker compose down -v --rmi all --remove-orphans
      - echo "✅ Docker cleanup complete"

  clean:local:
    desc: Clean local development artifacts (cache, build files, etc.)
    cmds:
      - find packages -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
      - find packages -type d -name "*.egg-info" -exec rm -rf {} + 2>/dev/null || true
      - find packages -type d -name ".pytest_cache" -exec rm -rf {} + 2>/dev/null || true
      - find packages -type d -name ".ruff_cache" -exec rm -rf {} + 2>/dev/null || true
      - find packages -type d -name "node_modules" -exec rm -rf {} + 2>/dev/null || true
      - find packages -type d -name "dist" -exec rm -rf {} + 2>/dev/null || true
      - find packages -type f -name "*.pyo" -delete 2>/dev/null || true
      - find packages -type f -name "*.pyc" -delete 2>/dev/null || true
      - find packages -type f -name "*.tsbuildinfo" -delete 2>/dev/null || true
      - rm -rf logs/*.log 2>/dev/null || true
      - rm -rf .pnpm-debug.log 2>/dev/null || true
      - echo "Local artifacts cleaned"
