[project]
name = "lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "domain",
    "modeler",
]

[tool.uv.sources]
domain = { path = "../domain" }
modeler = { path = "../modeler" }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evaluation"]
