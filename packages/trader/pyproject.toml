[project]
name = "trader"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "domain",
    "store",
    "listener",
    "modeler",
    "py-clob-client>=0.32.0",
    "requests>=2.32.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.uv.sources]
domain = { workspace = true }
store = { workspace = true }
listener = { workspace = true }
modeler = { workspace = true }

[dependency-groups]
dev = [
    "hypothesis>=6.148.7",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]
