[project]
name = "listener"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "massive>=1.0.0",
    "python-dotenv>=1.0.0",
    "domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/listener"]

[tool.uv.sources]
domain = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
]
